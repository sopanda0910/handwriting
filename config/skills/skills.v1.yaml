    category: spacing
  - key: spelling.stage.pre_phonetic
    label: "Pre-phonetic spelling stage"
    category: spelling
  - key: spelling.stage.semi_phonetic
    label: "Semi-phonetic spelling stage"
    category: spelling
  - key: spelling.stage.phonetic
