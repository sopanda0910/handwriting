# Skill taxonomy v1 — curriculum-anchored constructs (GOALS §6, open question 2).
# Own taxonomy for the alpha, structured so a CCSS or curriculum crosswalk can
# be added later without renaming keys. Versioned: additive changes bump the
# minor; renames/removals require a new file and a migration.
